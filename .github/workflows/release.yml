# AtomReasonX — Multi-platform Desktop Release
#
# Build matrix follows the Reasonix desktop approach: each platform builds on
# its own native runner (no cross-compilation of CGO/WebKit binaries), so the
# matrix fans out to one runner per OS/arch:
#   windows-latest  → .msi + .exe (NSIS installer)
#   macos-latest    → .dmg (ARM64 + x64)
#   ubuntu-latest   → .deb + .AppImage
#
# Triggers:
#   - Push a tag matching v* (e.g. v0.1.0, v0.2.0-beta) → build + release
#   - Manual dispatch via GitHub Actions tab (requires the tag input)
#
# Prerequisites:
#   - Rust toolchain (dtolnay/rust-toolchain@v1, adds matrix target)
#   - Node.js 20
#   - Linux: system webkit/gtk deps (installed below on ubuntu-latest)
#
# The Python test gate runs first to ensure backend contracts pass before any
# installer is packaged.

name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  # ── Python backend test gate ──────────────────────────────────────────
  python-tests:
    name: Python Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m unittest discover tests -v
        env:
          PYTHONPATH: src

  # ── Build matrix (one native runner per platform) ─────────────────────
  build:
    name: Build ${{ matrix.label }}
    needs: python-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS ARM64
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux x64
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ── System dependencies (Linux) ──────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── Rust toolchain (per-matrix target) ───────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/atomreasonx/src-tauri -> target

      # ── Node.js ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/atomreasonx/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/atomreasonx
        run: npm ci

      # ── Build Go sidecar (required by the Tauri shell) ───────────────
      - name: Build spiroctl sidecar
        working-directory: frontend/atomreasonx
        run: npm run sidecar:build

      # ── Tauri build + release upload ─────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend/atomreasonx
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "AtomReasonX ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## AtomReasonX — Reason at Atomic Scale, Build Beyond Materials.

            ### Installers

            | Platform | File |
            |---|---|
            | Windows x64 | `.msi` / `.exe` (NSIS) |
            | macOS ARM64 (Apple Silicon) | `.dmg` |
            | macOS x64 (Intel) | `.dmg` |
            | Linux x64 | `.deb` / `.AppImage` |

            ### What's included

            - AtomReasonX desktop shell (Vite + React + TypeScript + Tauri 2)
            - Reasonix-style workbench: settings centre (built-in model endpoints,
              fetch remote model lists, context windows, live connectivity test),
              session transcript with multi-session history, local search,
              evidence graph, knowledge imports (.md/.txt), JSON backup export
            - Live model channel: OpenAI-compatible chat completions through a
              real HTTP transport (stdlib urllib, zero deps) with per-provider
              API keys stored in the backend secret store
            - Data platform: HTL screening workbench, source catalog, workflow
              operator tasks, telemetry (context ring + status bar)
            - Tauri 2 updater (auto-update from this repository's releases)

            ### Prerequisites

            - **Windows**: Windows 10 1803+ (WebView2 is pre-installed on Win11)
            - **macOS**: macOS 10.15+
            - **Linux**: WebKit2GTK 4.1 (Ubuntu 22.04+, Fedora 36+, or equivalent)
          releaseDraft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') || contains(github.event.inputs.tag || github.ref_name, 'alpha') }}
          args: ${{ matrix.args }}

  # ── Summary ─────────────────────────────────────────────────────────
  release-summary:
    name: Release Summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print release info
        run: |
          echo "✅ Release completed successfully."
          echo "Tag: ${{ github.event.inputs.tag || github.ref_name }}"
          echo "Builds: Windows x64, macOS ARM64, macOS x64, Linux x64"
          echo "Check the GitHub Releases page for downloadable installers."

# AtomReasonX — Multi-platform Desktop Release (structured pipeline)
#
# Stage 1  resolve   — normalize tag / version / prerelease from the trigger.
# Stage 2  test-gate — Python + Go + frontend tests must pass before packaging.
# Stage 3  build     — one native runner per platform (Reasonix/tauri-action
#                      approach; no cross-compilation of CGO/WebKit binaries):
#                        windows-latest → .msi + .exe (NSIS)
#                        macos-latest   → .dmg (ARM64 + x64)
#                        ubuntu-latest  → .deb + .AppImage
#                      Every platform uploads its own artifact (CodeWhale-style
#                      named artifacts) so each OS build is independently
#                      inspectable before release publication.
# Stage 4  publish   — tauri-action creates the GitHub Release, attaches all
#                      platform bundles and generates latest.json for the
#                      Tauri 2 updater.
#
# Triggers:
#   - Push a tag matching v* (e.g. v0.1.0, v0.2.0-beta)
#   - Manual dispatch via GitHub Actions tab (requires the tag input)

name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  actions: write

concurrency:
  # One publisher per release tag; never cancel an in-progress release.
  group: release-desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Stage 1: resolve ───────────────────────────────────────────────────
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.outputs.tag }}
      prerelease: ${{ steps.outputs.prerelease }}
    steps:
      - id: outputs
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="${REF_NAME#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          case "${TAG}" in
            *alpha*|*beta*|*rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # ── Stage 2: test gate ─────────────────────────────────────────────────
  test-gate:
    name: Test gate
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Python tests
        run: uv run python -m unittest discover tests -v 2>&1 | tee python-test.log
        env:
          PYTHONPATH: src
      - name: Upload Python test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-gate-python-log
          path: python-test.log
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/atomreasonx/package-lock.json
      - name: Frontend tests + build
        working-directory: frontend/atomreasonx
        run: npm ci && npm test && npm run build

  # ── Stage 3: platform build matrix (one native runner per platform) ────
  build:
    name: Build ${{ matrix.label }}
    needs: test-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
            artifact: atomreasonx-windows-x64
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS ARM64
            artifact: atomreasonx-macos-aarch64
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS x64
            artifact: atomreasonx-macos-x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux x64
            artifact: atomreasonx-linux-x64
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ── System dependencies (Linux only) ──────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── Rust toolchain (per-matrix target) ────────────────────────────
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/atomreasonx/src-tauri -> target

      # ── Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/atomreasonx/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/atomreasonx
        run: npm ci

      # ── Go toolchain (spiroctl sidecar build) ─────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ── Build Go sidecar (per-platform binary, required by the Tauri shell) ─
      - name: Build spiroctl sidecar
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-atomreasonx-spiroctl-sidecar.ps1 -RepositoryRoot "${{ github.workspace }}"

      # ── Tauri build + release upload ──────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend/atomreasonx
          tagName: "v${{ needs.resolve.outputs.tag }}"
          releaseName: "AtomReasonX v${{ needs.resolve.outputs.tag }}"
          releaseBody: |
            ## AtomReasonX — Reason at Atomic Scale, Build Beyond Materials.

            ### Installers

            | Platform | File |
            |---|---|
            | Windows x64 | `.msi` / `.exe` (NSIS) |
            | macOS ARM64 (Apple Silicon) | `.dmg` |
            | macOS x64 (Intel) | `.dmg` |
            | Linux x64 | `.deb` / `.AppImage` |

            ### What's included

            - AtomReasonX desktop shell (Vite + React + TypeScript + Tauri 2)
            - Reasonix-style workbench: settings centre (built-in model endpoints,
              fetch remote model lists, context windows, live connectivity test),
              session transcript with multi-session history, local search,
              evidence graph, knowledge imports (.md/.txt), JSON backup export
            - Live model channel: OpenAI-compatible chat completions through a
              real HTTP transport (stdlib urllib, zero deps) with per-provider
              API keys stored in the backend secret store
            - Data platform: HTL screening workbench, source catalog, workflow
              operator tasks, telemetry (context ring + status bar)
            - Tauri 2 updater (auto-update from this repository's releases)

            ### Prerequisites

            - **Windows**: Windows 10 1803+ (WebView2 is pre-installed on Win11)
            - **macOS**: macOS 10.15+
            - **Linux**: WebKit2GTK 4.1 (Ubuntu 22.04+, Fedora 36+, or equivalent)
          releaseDraft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  # ── Stage 4: summary ─────────────────────────────────────────────────
  release-summary:
    name: Release Summary
    needs: [build, resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Print release info
        run: |
          echo "✅ Release completed successfully."
          echo "Tag: ${{ needs.resolve.outputs.tag }}"
          echo "Builds: Windows x64, macOS ARM64, macOS x64, Linux x64"
          echo "Check the GitHub Releases page for downloadable installers."

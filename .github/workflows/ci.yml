# AtomReasonX — Continuous Integration
#
# Runs on every push to main and every PR.
# Validates Python tests, Go tests, frontend tests/build, and agent hygiene.
# Does NOT build desktop installers (use release.yml for that).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Python tests
        run: uv run python -m unittest discover tests -v 2>&1 | tee python-test.log
        env:
          PYTHONPATH: src
      - name: Upload Python test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log
          path: python-test.log

  frontend-check:
    name: Frontend Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend files exist
        run: |
          test -f frontend/atomreasonx/package.json
          test -f frontend/atomreasonx/vite.config.ts
          test -f frontend/atomreasonx/tsconfig.json
          test -f frontend/atomreasonx/src/AppShell.tsx
          test -f frontend/atomreasonx/src/contracts/types.ts
          test -f frontend/atomreasonx/src/fixtures/atomreasonx-ui-fixture.json
          test -f frontend/atomreasonx/src-tauri/tauri.conf.json
          test -f frontend/atomreasonx/src-tauri/Cargo.toml
      - name: Verify fixture is valid JSON
        run: |
          python3 -c "import json; json.load(open('frontend/atomreasonx/src/fixtures/atomreasonx-ui-fixture.json'))"
      - name: Verify fixture is provisional
        run: |
          python3 -c "import json; assert json.load(open('frontend/atomreasonx/src/fixtures/atomreasonx-ui-fixture.json'))['_provisional']"

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  frontend-tests:
    name: Frontend Tests And Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/atomreasonx/package-lock.json
      - name: Install dependencies
        working-directory: frontend/atomreasonx
        run: npm ci
      - name: Run Vitest suite
        working-directory: frontend/atomreasonx
        run: npm test
      - name: TypeScript + Vite build
        working-directory: frontend/atomreasonx
        run: npm run build

  hygiene:
    name: Repository Agent Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hygiene script requires core.hooksPath == .githooks, which a fresh
      # CI checkout does not have. Configure it so the check passes in CI the
      # same way it does on developer machines.
      - name: Configure repository hooks path
        run: git config core.hooksPath .githooks
      - name: Run agent hygiene checks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-agent-hygiene.ps1 -RepositoryRoot "$PWD"
